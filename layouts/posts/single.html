{{ define "main" }}
<div class="row justify-content-center">
  <div class="col-md-12 col-lg-10 col-xl-8">
    <article>
      <h1>{{ .Title }}</h1>
      {{ partial "main/blog-meta.html" . }}
      <p class="lead">{{ .Params.lead | safeHTML }}</p>
      {{ partial "main/render-content.html" (dict "Content" .Content) }}
    </article>
  </div>
</div>
{{ end }}
